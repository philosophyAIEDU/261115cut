# Push a tag like v1.1.0 (matching sophicut/__init__.py) -> builds the Windows installer and the
# Mac disk images and attaches them to the GitHub Release. The app and the website pick them up.
name: Release installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sophicut/__init__.py)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} does not match __version__ $v"; exit 1; }
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "소피컷 ${tag#v}" --notes-file packaging/release-notes.md --generate-notes

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: SophiCut-Setup
          path: build/installer/SophiCut-Setup.exe
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" build/installer/SophiCut-Setup.exe --clobber

  mac:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1 and later)
            label: AppleSilicon
          - runner: macos-15-intel  # Intel Macs
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build disk image
        run: PYTHON=python bash packaging/build_mac.sh
      - name: Smoke test (transcribe + export with the built app)
        run: |
          say -o build/speech.aiff "Hello. This is a short test of the SophiCut editor. We cut words from the transcript." || true
          FF=build/ffmpeg-mac/ffmpeg
          if [ -f build/speech.aiff ]; then
            $FF -y -v error -f lavfi -i color=c=0x123:s=640x360:d=8 -i build/speech.aiff -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac build/smoke.mp4
          else
            $FF -y -v error -f lavfi -i color=c=0x123:s=640x360:d=6 -f lavfi -i sine=f=440:d=6 -c:v libx264 -pix_fmt yuv420p -c:a aac build/smoke.mp4
          fi
          python packaging/smoke_test.py build/dist/SophiCut.app/Contents/MacOS/SophiCut build/smoke.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: SophiCut-Mac-${{ matrix.label }}
          path: build/installer/SophiCut-Mac-${{ matrix.label }}.dmg
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "build/installer/SophiCut-Mac-${{ matrix.label }}.dmg" --clobber
